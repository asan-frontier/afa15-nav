<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아산정책연구원 → 팜시티테이블 길 안내</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root {
  --navy:   #1A3966;
  --navy-d: #122844;
  --dest:   #E07B39;
  --bg:     #F2F1EE;
  --surface:#FFFFFF;
  --fg:     #1A1A1A;
  --muted:  #6A6A6A;
  --border: #E0DFDB;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:     #111110;
    --surface:#1E1E1C;
    --fg:     #EDEDE8;
    --muted:  #9A9994;
    --border: #2E2E2B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:     #111110;
  --surface:#1E1E1C;
  --fg:     #EDEDE8;
  --muted:  #9A9994;
  --border: #2E2E2B;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100dvh;
}

/* ── Header ── */
.hd {
  background: var(--navy);
  color: white;
  padding: 18px max(16px, env(safe-area-inset-left,0px));
  padding-right: max(16px, env(safe-area-inset-right,0px));
  text-align: center;
}
.hd-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.55);
  margin-bottom: 5px;
}
.hd-title { font-size: 17px; font-weight: 700; line-height: 1.3; }
.hd-sub   { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 4px; }

/* ── Main ── */
main { overflow-y: auto; background: var(--bg); }

.route {
  max-width: 520px;
  margin: 0 auto;
  padding-bottom: max(20px, env(safe-area-inset-bottom,0px));
}

@media (min-width: 480px) {
  main { padding: 20px 16px 0; }
  .route {
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.12);
    margin-bottom: 32px;
  }
}

/* ── Slideshow ── */
.slideshow { background: #0A0A0A; }
.slide { display: none; flex-direction: column; }
.slide.on { display: flex; }

/* ── Photo ── */
.photo-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  overflow: hidden;
  background: #111;
}
.photo-wrap img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
  user-select: none;
}
.no-photo {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: rgba(255,255,255,0.35);
  font-size: 13px;
}

/* ── Step badge (top-left) ── */
.step-badge {
  position: absolute;
  top: 12px; left: 12px;
  min-width: 32px; height: 32px;
  padding: 0 10px;
  background: var(--navy-d);
  color: white;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  z-index: 2;
}

/* ── Direction badge (bottom-right) ── */
.dir-badge {
  position: absolute;
  bottom: 12px; right: 12px;
  background: rgba(0,0,0,0.78);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border: 1.5px solid rgba(255,255,255,0.22);
  border-radius: 20px;
  padding: 7px 14px 7px 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  pointer-events: none;
  z-index: 3;
}
.dir-badge.dest {
  background: rgba(100,45,10,0.88);
  border-color: rgba(224,123,57,0.5);
}
.dir-icon { font-size: 20px; line-height: 1; }
.dir-text { font-size: 14px; font-weight: 700; color: white; letter-spacing: 0.01em; }

/* ── Caption ── */
.caption {
  background: var(--surface);
  padding: 14px max(16px, env(safe-area-inset-right,0px)) 14px max(16px, env(safe-area-inset-left,0px));
  border-top: 1px solid var(--border);
  min-height: 100px;
}
.cap-landmark {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}
.cap-inst {
  font-size: 22px;
  font-weight: 700;
  line-height: 1.25;
  color: var(--fg);
}
.cap-inst.dest-text { color: var(--dest); }
.cap-sub {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 5px;
  line-height: 1.5;
}

/* ── Progress dots ── */
.dots {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px 16px 6px;
  background: var(--surface);
  border-top: 1px solid var(--border);
}
.dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--border);
  transition: background 0.2s, transform 0.2s;
  flex-shrink: 0;
}
.dot.on { background: var(--navy); transform: scale(1.3); }

/* ── Nav ── */
.nav-bar {
  display: flex;
  gap: 10px;
  padding: 10px max(16px, env(safe-area-inset-right,0px)) max(14px, calc(env(safe-area-inset-bottom,0px) + 10px));
  padding-left: max(16px, env(safe-area-inset-left,0px));
  background: var(--surface);
}
.nav-btn {
  height: 46px;
  border: none;
  border-radius: 12px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
}
.nav-btn:active  { transform: scale(0.97); }
.nav-btn:disabled { opacity: 0.25; cursor: default; }
.nav-btn:disabled:active { transform: none; }
.btn-prev { flex: 0 0 100px; background: var(--bg); color: var(--fg); }
.btn-next { flex: 1; background: var(--navy); color: white; }
.btn-next.dest-btn { background: var(--dest); }
</style>
</head>
<body>

<div class="hd">
  <div class="hd-label">아산 프론티어 아카데미 15기</div>
  <div class="hd-title">아산정책연구원 → 팜시티테이블</div>
  <div class="hd-sub">저녁 행사장 오시는 길 안내</div>
</div>

<main>
  <div class="route">
    <div class="slideshow" id="ss"></div>
    <div class="dots" id="dots"></div>
    <div class="nav-bar">
      <button class="nav-btn btn-prev" id="btn-prev" onclick="go(-1)" disabled>‹ 이전</button>
      <button class="nav-btn btn-next" id="btn-next" onclick="go(1)">다음 ›</button>
    </div>
  </div>
</main>

<script>
const STEPS = [
  {
    img: 'photos/r1_01.jpg',
    landmark: 'STEP 1 · 아산정책연구원 앞',
    inst: '정문 나와서 직진',
    sub: '아산정책연구원 정문을 나와 앞 도로를 따라 직진하세요.',
    icon: '⬆', dir: '직진'
  },
  {
    img: 'photos/r1_02.jpg',
    landmark: 'STEP 2 · 경회궁1가길 표지판',
    inst: '경회궁1가길 표지판 → 골목으로 직진',
    sub: '파란색 "경회궁1가길" 표지판이 보이면 그 방향으로 계속 직진하세요.',
    icon: '⬆', dir: '직진'
  },
  {
    img: 'photos/r1_03.jpg',
    landmark: 'STEP 3 · 막히도로 표시',
    inst: '"막히도로" 표시 무시하고 직진',
    sub: '도로에 "막히도로" 표시가 있어도 보행자는 통행 가능합니다. TAPAMADRE 카페가 보이면 맞는 길입니다.',
    icon: '⬆', dir: '직진 가능'
  },
  {
    img: 'photos/r1_04.jpg',
    landmark: 'STEP 4 · 주차금지 표시 & 삼거리',
    inst: '삼거리에서 계속 직진',
    sub: '주차금지 표시와 가을 나무가 있는 삼거리입니다. 오른쪽으로 꺾지 말고 계속 직진하세요.',
    icon: '⬆', dir: '직진'
  },
  {
    img: 'photos/r1_05.jpg',
    landmark: 'STEP 5 · 축구회관 KFA HOUSE',
    inst: 'KFA 축구회관 지나 직진',
    sub: '"축구회관 KFA HOUSE" 건물이 오른쪽에 보이면 맞는 방향입니다. 옆을 지나 계속 직진하세요.',
    icon: '⬆', dir: '직진'
  },
  {
    img: 'photos/r1_06.jpg',
    landmark: 'STEP 6 · 큰 도로 & 횡단보도',
    inst: '횡단보도 건너기',
    sub: '큰 도로가 나옵니다. 횡단보도를 건너 반대편으로 이동하세요.',
    icon: '⬆', dir: '횡단보도'
  },
  {
    img: 'photos/r1_07.jpg',
    landmark: 'STEP 7 · 팜시티테이블 담장',
    inst: '꽃무늬 담장 따라 올라가기 — 거의 도착!',
    sub: '팜시티테이블 건물의 꽃무늬 담장이 보입니다! 담장을 따라 계속 올라가세요. 거의 다 왔어요.',
    icon: '⬆', dir: '직진 · 거의 도착'
  },
  {
    img: 'photos/r1_08.jpg',
    landmark: '도착',
    inst: '팜시티테이블 도착!',
    sub: '"팜시티테이블" 현수막이 보이면 도착입니다. 입구로 들어가시면 안내해 드립니다. 🎉',
    icon: '🏁', dir: '도착!', isDest: true
  }
];

let cur = 0;
const ss      = document.getElementById('ss');
const dotsEl  = document.getElementById('dots');
const prevBtn = document.getElementById('btn-prev');
const nextBtn = document.getElementById('btn-next');

STEPS.forEach((step, i) => {
  const slide = document.createElement('div');
  slide.className = 'slide' + (i === 0 ? ' on' : '');

  slide.innerHTML = `
    <div class="photo-wrap">
      ${step.img
        ? `<img src="${step.img}" alt="${step.landmark}" draggable="false" loading="${i===0?'eager':'lazy'}">`
        : `<div class="no-photo"><span style="font-size:44px">📷</span><span>사진 준비 중</span></div>`
      }
      <div class="step-badge">${step.isDest ? '✓' : `${i+1} / ${STEPS.length}`}</div>
      <div class="dir-badge${step.isDest ? ' dest' : ''}">
        <span class="dir-icon">${step.icon}</span>
        <span class="dir-text">${step.dir}</span>
      </div>
    </div>
    <div class="caption">
      <div class="cap-landmark">${step.landmark}</div>
      <div class="cap-inst${step.isDest ? ' dest-text' : ''}">${step.inst}</div>
      <div class="cap-sub">${step.sub}</div>
    </div>
  `;
  ss.appendChild(slide);

  const dot = document.createElement('div');
  dot.className = 'dot' + (i === 0 ? ' on' : '');
  dotsEl.appendChild(dot);
});

function updateNav() {
  prevBtn.disabled = cur === 0;
  const isLast = cur === STEPS.length - 1;
  nextBtn.textContent = isLast ? '처음으로' : '다음 ›';
  nextBtn.className = 'nav-btn btn-next' + (isLast ? ' dest-btn' : '');
  nextBtn.onclick = isLast ? () => go(-(STEPS.length - 1)) : () => go(1);
}

function go(delta) {
  const slides = ss.querySelectorAll('.slide');
  const dots   = dotsEl.querySelectorAll('.dot');
  slides[cur].classList.remove('on');
  dots[cur].classList.remove('on');
  cur = Math.max(0, Math.min(STEPS.length - 1, cur + delta));
  slides[cur].classList.add('on');
  dots[cur].classList.add('on');
  updateNav();
}

/* Touch swipe */
let tx = 0;
ss.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
ss.addEventListener('touchend',   e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
}, { passive: true });

/* Keyboard */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') go(1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   go(-1);
});
</script>

</body>
</html>
